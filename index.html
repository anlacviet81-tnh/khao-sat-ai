<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Khảo sát trình độ AI</title>
<meta name="description" content="Khảo sát trình độ AI – xếp cộng đồng học tập phù hợp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Lexend:wght@500;600;700&display=swap">
<style>
:root{
  --bg:#F3F4EF; --card:#FFFFFF; --ink:#16231E; --muted:#5D6B64; --line:#D9DED6;
  --accent:#2F4BC0; --accent-soft:#E4E8FA; --warm:#C8811F; --warm-soft:#F8ECD8;
  --good:#2C7A52; --bad:#B4432F; --on-accent:#fff;
  --f-display:"Lexend","Be Vietnam Pro",system-ui,sans-serif;
  --f-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#111815; --card:#1A231F; --ink:#E9EEEA; --muted:#9AA8A1; --line:#2C3833;
  --accent:#8C9EF2; --accent-soft:#232B4D; --warm:#E3A851; --warm-soft:#3A2D18;
  --good:#6CC495; --bad:#E58A77; --on-accent:#111815; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55}
.wrap{max-width:560px;margin:0 auto;padding:20px max(16px,env(safe-area-inset-right,0px)) 48px max(16px,env(safe-area-inset-left,0px))}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px;font-size:13px;color:var(--muted)}
.part{font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.bar{height:6px;border-radius:6px;background:var(--line);overflow:hidden;margin-bottom:22px}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
h1,h2{font-family:var(--f-display);text-wrap:balance;margin:0}
h1{font-size:28px;line-height:1.25;font-weight:700}
h2{font-size:21px;line-height:1.35;font-weight:600}
h3{font-family:var(--f-display);font-size:17px;font-weight:600;margin:28px 0 10px}
p{margin:0}
.lead{color:var(--muted);margin-top:10px}
.stack{display:flex;flex-direction:column;gap:12px}
.hint{font-size:13px;color:var(--muted);margin-top:6px}
.opt{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;padding:14px 16px;border:1.5px solid var(--line);
  border-radius:12px;background:var(--card);color:var(--ink);font:inherit;cursor:pointer;min-height:54px}
.opt .mk{flex:none;width:22px;height:22px;margin-top:1px;border:2px solid var(--line);border-radius:50%;display:grid;place-items:center}
.opt.multi .mk{border-radius:6px}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt[aria-pressed="true"] .mk{border-color:var(--accent);background:var(--accent)}
.opt[aria-pressed="true"] .mk::after{content:"";width:8px;height:8px;border-radius:2px;background:var(--card)}
.opt:focus-visible,.btn:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--warm);outline-offset:2px}
.nav{display:flex;gap:10px;margin-top:24px}
.btn{flex:1;padding:15px 18px;border-radius:12px;border:0;font:600 16px var(--f-body);cursor:pointer;background:var(--accent);color:var(--on-accent)}
.btn.ghost{flex:0 0 auto;background:transparent;color:var(--muted);border:1.5px solid var(--line)}
.btn:disabled{opacity:.4;cursor:not-allowed}
a.btn{display:block;text-align:center;text-decoration:none;margin-top:12px}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:22px 0}
.facts div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.facts b{display:block;font-family:var(--f-display);font-size:22px;color:var(--accent)}
.facts span{font-size:12.5px;color:var(--muted)}
.sec{margin-top:6px;padding-left:22px}
.sec li{margin-bottom:6px}
label.f{display:block;font-weight:600;font-size:14px;margin-bottom:6px}
input[type=text],input[type=tel],input[type=email],textarea{width:100%;padding:14px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit}
textarea{min-height:70px;resize:vertical}
.err{color:var(--bad);font-size:14px;min-height:20px;margin-top:8px}
.consent{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--muted)}
.consent input{width:20px;height:20px;margin-top:2px;accent-color:var(--accent);flex:none}
.level{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}
.badge{display:inline-block;padding:4px 10px;border-radius:999px;background:var(--warm-soft);color:var(--warm);font-size:12.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.score{font-family:var(--f-display);font-size:44px;font-weight:700;line-height:1;margin-top:12px}
.score small{font-size:18px;color:var(--muted);font-weight:500}
.rows{display:flex;flex-direction:column;gap:12px;margin-top:18px}
.row .lbl{display:flex;justify-content:space-between;font-size:14px;margin-bottom:5px}
.track{height:10px;border-radius:6px;background:var(--line);overflow:hidden}
.track i{display:block;height:100%;border-radius:6px;background:var(--accent)}
.track i.low{background:var(--warm)}
.tool{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.tool b{display:block;font-size:15.5px}
.tool p{font-size:14.5px;color:var(--muted);margin-top:3px}
.note{background:var(--warm-soft);border-radius:12px;padding:14px 16px;font-size:14.5px}
.done{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px;font-size:14px;color:var(--muted);margin-top:14px}
.done b{color:var(--good)}
.contact{margin-top:10px;font-size:14.5px;display:flex;flex-direction:column;gap:4px}
.contact span{font-weight:600;color:var(--ink);user-select:all}
.loading{text-align:center;color:var(--muted);padding:60px 0}
.spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:s 1s linear infinite;margin:0 auto 12px}
@keyframes s{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}.spin{animation:none}}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="loading"><div class="spin"></div>Đang tải phiếu khảo sát…</div></div>

<script>
/* Địa chỉ API Apps Script (…/exec). */
var API_URL = 'https://script.google.com/macros/s/AKfycbyLwpzf1bwJ_qdW9Nsthl02058PDe1nhaPXER3MeSYlbrQVl__JxGOmAl9lgojSgNq8wg/exec';

var app = document.getElementById('app');
var ND = null;              // nội dung phiếu tải từ máy chủ (không kèm điểm)
var S = null;               // trạng thái người làm
var KQ = null;              // kết quả trả về
var dangGui = false;
var KHOA_NHAP = 'ksai_nhap_v2';

function goi(fn, args) {
  if (!API_URL) return Promise.reject(new Error('Trang chưa được cấu hình địa chỉ máy chủ.'));
  var lan = 0;
  function mot() {
    return fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: fn, args: args || [] }) })
      .then(function (r) { if (!r.ok) throw new Error('Máy chủ đang bận (HTTP ' + r.status + ')'); return r.json(); })
      .then(function (j) { if (!j.ok) { var e = new Error(j.error); e.logic = true; throw e; } return j.data; });
  }
  function thu() {
    return mot().catch(function (e) {
      if (!e.logic && lan < 3) { lan++; return new Promise(function (r) { setTimeout(r, 1200 * lan); }).then(thu); }
      if (!e.logic) e.message = 'Không kết nối được máy chủ. Anh/chị kiểm tra mạng rồi thử lại.';
      throw e;
    });
  }
  return thu();
}

var esc = function (s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
var isSingle = function (q) { return q.t === 'single' || q.t === 'info'; };
function trangThaiMoi() { return { step: -1, ans: ND.q.map(function (q) { return isSingle(q) ? null : []; }), name: '', unit: '', phone: '', email: '', job: '', agree: false }; }
function answered(i) { var a = S.ans[i]; return isSingle(ND.q[i]) ? a !== null : a.length > 0; }
function luu() { try { localStorage.setItem(KHOA_NHAP, JSON.stringify(S)); } catch (e) {} }
function napNhap() {
  try {
    var s = JSON.parse(localStorage.getItem(KHOA_NHAP) || 'null');
    if (s && Array.isArray(s.ans) && s.ans.length === ND.q.length) return s;
  } catch (e) {}
  return null;
}

function render() {
  luu();
  if (KQ) return result();
  if (S.step === -1) return intro();
  if (S.step < ND.q.length) return question(S.step);
  return contact();
}

function intro() {
  var dem = { A: 0, B: 0, C: 0, I: 0 };
  app.innerHTML =
    '<span class="badge">Khởi động buổi học</span>' +
    '<h1 style="margin-top:14px">' + esc(ND.tieuDe) + '</h1>' +
    (ND.gioiThieu ? '<p class="lead">' + esc(ND.gioiThieu) + '</p>' : '') +
    '<div class="facts"><div><b>' + ND.q.length + '</b><span>câu hỏi</span></div><div><b>5\'</b><span>khoảng thời gian</span></div><div><b>4</b><span>cộng đồng học tập</span></div></div>' +
    '<ol class="sec"><li><b>' + esc(ND.parts.I) + '</b>: độ tuổi, lĩnh vực, vị trí công việc</li><li><b>' + esc(ND.parts.A) + '</b>: đã dùng gì, dùng bao lâu</li>' +
    '<li><b>' + esc(ND.parts.B) + '</b>: hỏi AI thế nào cho đúng, an toàn</li><li><b>' + esc(ND.parts.C) + '</b>: AI đang giúp được bao nhiêu</li></ol>' +
    '<p class="hint">Kết quả chỉ gửi riêng cho giảng viên. Trong nhóm cộng đồng, anh/chị chỉ giới thiệu tên và đơn vị.</p>' +
    '<div class="nav"><button class="btn" id="go">' + (S.ans.some(function (a, i) { return answered(i); }) ? 'Làm tiếp phần đang dở' : 'Bắt đầu') + '</button></div>';
  document.getElementById('go').onclick = function () {
    var k = 0; while (k < ND.q.length && answered(k)) k++;
    S.step = k; render(); window.scrollTo(0, 0);
  };
}

function header(i) {
  var n = ND.q.length, pct = Math.round(i / (n + 1) * 100);
  var label = i < n ? ND.parts[ND.q[i].p] : 'Nhận kết quả';
  return '<div class="top"><span class="part">' + esc(label) + '</span><span>' + (i < n ? 'Câu ' + (i + 1) + '/' + n : 'Bước cuối') + '</span></div>' +
    '<div class="bar"><i style="width:' + pct + '%"></i></div>';
}

function question(i) {
  var q = ND.q[i], a = S.ans[i], multi = !isSingle(q);
  var opts = q.o.slice(); if (q.none) opts.push(q.none);
  app.innerHTML = header(i) +
    '<h2>' + esc(q.q) + '</h2>' + (q.h ? '<p class="hint">' + esc(q.h) + '</p>' : '') +
    '<div class="stack" style="margin-top:18px" role="group">' +
    opts.map(function (t, k) {
      var on = multi ? a.indexOf(k) >= 0 : a === k;
      return '<button class="opt' + (multi ? ' multi' : '') + '" data-k="' + k + '" aria-pressed="' + on + '"><span class="mk"></span><span>' + esc(t) + '</span></button>';
    }).join('') + '</div>' +
    '<p class="err" id="err"></p>' +
    '<div class="nav"><button class="btn ghost" id="back">Quay lại</button><button class="btn" id="next" ' + (answered(i) ? '' : 'disabled') + '>' +
    (i === ND.q.length - 1 ? 'Xong phần câu hỏi' : 'Tiếp') + '</button></div>';
  Array.prototype.forEach.call(app.querySelectorAll('.opt'), function (b) {
    b.onclick = function () {
      var k = +b.dataset.k;
      if (!multi) {
        S.ans[i] = k; render();
        setTimeout(function () { if (S.step === i) { S.step++; render(); window.scrollTo(0, 0); } }, 220);
        return;
      }
      var noneIdx = q.none ? q.o.length : -1, cur = S.ans[i];
      if (k === noneIdx) cur = cur.indexOf(k) >= 0 ? [] : [k];
      else {
        cur = cur.filter(function (x) { return x !== noneIdx; });
        if (cur.indexOf(k) >= 0) cur = cur.filter(function (x) { return x !== k; });
        else {
          if (q.max && cur.length >= q.max) { document.getElementById('err').textContent = 'Chỉ chọn tối đa ' + q.max + ' mục. Bỏ bớt một mục để chọn mục khác.'; return; }
          cur = cur.concat([k]);
        }
      }
      S.ans[i] = cur; render();
    };
  });
  document.getElementById('back').onclick = function () { S.step--; render(); };
  document.getElementById('next').onclick = function () { if (answered(i)) { S.step++; render(); window.scrollTo(0, 0); } };
}

function contact() {
  app.innerHTML = header(ND.q.length) +
    '<h2>Thông tin để giảng viên liên hệ</h2>' +
    '<p class="hint">Nhập số điện thoại dùng Zalo hoặc Viettel Tammi, hoặc email (ít nhất một). Thông tin này chỉ giảng viên giữ, dùng để gửi kết quả, xếp lớp và mời các khóa học phù hợp.</p>' +
    '<div class="stack" style="margin-top:18px">' +
    '<div><label class="f" for="nm">Họ và tên</label><input id="nm" type="text" autocomplete="name" maxlength="80" value="' + esc(S.name) + '"></div>' +
    '<div><label class="f" for="un">Đơn vị công tác</label><input id="un" type="text" maxlength="150" placeholder="Ví dụ: Công ty ABC, UBND phường X, Trường THPT Y" value="' + esc(S.unit) + '"></div>' +
    '<div><label class="f" for="ph">Số điện thoại dùng Zalo / Viettel Tammi</label><input id="ph" type="tel" inputmode="numeric" autocomplete="tel" maxlength="16" placeholder="Ví dụ: 0912345678" value="' + esc(S.phone) + '"></div>' +
    '<div><label class="f" for="em">Hoặc email</label><input id="em" type="email" autocomplete="email" maxlength="100" value="' + esc(S.email) + '"></div>' +
    '<div><label class="f" for="jb">Công việc chính đang làm <span class="hint">(không bắt buộc)</span></label><textarea id="jb" maxlength="300" placeholder="Ví dụ: văn thư, tổng hợp báo cáo tuần, soạn công văn">' + esc(S.job) + '</textarea></div>' +
    '<label class="consent"><input id="ag" type="checkbox" ' + (S.agree ? 'checked' : '') + '><span>Tôi đồng ý cho giảng viên dùng số điện thoại, email này để gửi kết quả và mời vào cộng đồng học tập.</span></label>' +
    '</div><p class="err" id="err"></p>' +
    '<div class="nav"><button class="btn ghost" id="back">Quay lại</button><button class="btn" id="see">Gửi và xem kết quả</button></div>';
  ['nm', 'un', 'ph', 'em', 'jb'].forEach(function (id) { document.getElementById(id).addEventListener('input', function () { save(); luu(); }); });
  document.getElementById('back').onclick = function () { save(); S.step--; render(); };
  document.getElementById('see').onclick = gui;
}
function save() {
  var v = function (id) { return document.getElementById(id); };
  S.name = v('nm').value; S.unit = v('un').value; S.phone = v('ph').value; S.email = v('em').value; S.job = v('jb').value; S.agree = v('ag').checked;
}

function gui() {
  if (dangGui) return;
  save();
  var e = document.getElementById('err'), btn = document.getElementById('see');
  var ph = S.phone.replace(/[\s.\-()]/g, '');
  e.textContent = '';
  if (!S.name.trim()) return e.textContent = 'Anh/chị nhập họ tên để giảng viên biết kết quả của ai.';
  if (!S.unit.trim()) return e.textContent = 'Anh/chị nhập đơn vị công tác để giảng viên xếp lớp.';
  if (!ph && !S.email.trim()) return e.textContent = 'Cần ít nhất số điện thoại hoặc email để nhận kết quả.';
  if (ph && !/^(0|\+?84)\d{9}$/.test(ph)) return e.textContent = 'Số điện thoại chưa đúng. Nhập 10 số, bắt đầu bằng 0.';
  if (S.email.trim() && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(S.email.trim())) return e.textContent = 'Email chưa đúng dạng, ví dụ: ten@gmail.com.';
  if (!S.agree) return e.textContent = 'Anh/chị đánh dấu ô đồng ý để giảng viên được liên hệ.';
  dangGui = true; btn.disabled = true; btn.textContent = 'Đang gửi…';
  goi('nopKhaoSat', [{ hoTen: S.name, donVi: S.unit, sdt: ph, email: S.email, moTaCV: S.job, dongY: S.agree, traLoi: S.ans }])
    .then(function (kq) { KQ = kq; try { localStorage.removeItem(KHOA_NHAP); } catch (x) {} result(); window.scrollTo(0, 0); })
    .catch(function (x) { e.textContent = x.message; btn.disabled = false; btn.textContent = 'Gửi lại'; })
    .then(function () { dangGui = false; });
}

function result() {
  var k = KQ, nhom = k.group.split(' · ')[0];
  var gv = k.gv || {};
  // Tên nền tảng theo link nhóm trong CauHinh (Zalo, Tammi, Facebook...)
  var nen = /zalo\.me/i.test(k.link) ? 'Zalo' : /tammi/i.test(k.link) ? 'Viettel Tammi' : /facebook\.com|fb\.com/i.test(k.link) ? 'Facebook' : '';
  var tren = nen ? ' trên ' + nen : '';
  var gvLines = [gv.name && 'Giảng viên: <span>' + esc(gv.name) + '</span>', gv.zalo && 'Zalo: <span>' + esc(gv.zalo) + '</span>', gv.tammi && 'Viettel Tammi: <span>' + esc(gv.tammi) + '</span>'].filter(Boolean);
  app.innerHTML =
    '<div class="level"><span class="badge">' + esc(k.group) + '</span>' +
    '<div class="score">' + k.total + '<small> / 42 điểm</small></div>' +
    '<h2 style="margin-top:8px">' + esc(k.name) + '</h2><p class="lead">' + esc(k.say) + '</p>' +
    '<div class="rows">' + ['A', 'B', 'C'].map(function (p) {
      var pct = Math.round(k.g[p] / k.max[p] * 100);
      return '<div class="row"><div class="lbl"><span>' + esc(k.parts[p]) + '</span><b>' + k.g[p] + '/' + k.max[p] + '</b></div><div class="track"><i class="' + (pct < 50 ? 'low' : '') + '" style="width:' + Math.max(pct, 3) + '%"></i></div></div>';
    }).join('') + '</div></div>' +
    '<p class="done"><b>✓ Đã gửi kết quả cho giảng viên.</b> Mã phiếu ' + esc(k.maPhieu) + (k.soLan > 1 ? ' (cập nhật lần ' + k.soLan + ')' : '') + '.</p>' +
    '<h3>Vào cộng đồng ' + esc(nhom) + tren + '</h3>' +
    '<p>Quét mã QR <b>' + esc(nhom) + '</b> đang chiếu trên màn hình giảng viên' + (k.link ? ', hoặc bấm nút dưới đây' : '') + '. Khi vào nhóm, chỉ giới thiệu họ tên và đơn vị.</p>' +
    (k.link ? '<a class="btn" href="' + esc(k.link) + '" target="_blank" rel="noopener">Vào ' + esc(nhom) + tren + '</a>' : '') +
    (gvLines.length ? '<div class="contact">' + gvLines.join('') + '</div>' : '') +
    '<h3>Công cụ và việc nên làm ngay</h3>' +
    '<div class="stack">' + k.tools.map(function (t) { return '<div class="tool"><b>' + esc(t[0]) + '</b><p>' + esc(t[1]) + '</p></div>'; }).join('') + '</div>' +
    '<h3>Chỗ cần bù</h3><p class="note">' + esc(k.weak) + '</p>' +
    '<div class="nav"><button class="btn ghost" id="redo" style="flex:1">Làm lại từ đầu</button></div>';
  document.getElementById('redo').onclick = function () { KQ = null; S = trangThaiMoi(); render(); window.scrollTo(0, 0); };
}

goi('layNoiDung').then(function (nd) {
  ND = nd;
  document.title = 'Khảo sát trình độ AI';
  S = napNhap() || trangThaiMoi();
  if (S.step > ND.q.length) S.step = ND.q.length;
  render();
}).catch(function (e) {
  app.innerHTML = '<div class="loading"><p class="err">' + esc(e.message) + '</p><div class="nav"><button class="btn" onclick="location.reload()">Tải lại</button></div></div>';
});
</script>
</body>
</html>
